version: 3

tasks:
  build:
    run: once
    cmd: env CGO_CFLAGS='-O3 -DNDEBUG' go build -trimpath -o bench .

  start:
    deps: [build]
    cmd: ./bench {{.CLI_ARGS}}

  test:
    cmd: go test -race ./...

  measure-build:
    cmd: python3 measure-build.py {{.CLI_ARGS | default "../results/go-build"}}

  benchmark:
    deps: [build]
    cmd: python3 measure-http.py {{.CLI_ARGS | default "../results/go-http"}}
