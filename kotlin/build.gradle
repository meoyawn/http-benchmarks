plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.4.20'
    id 'application'
    id "com.gradleup.shadow" version "9.6.1"
    id 'org.graalvm.buildtools.native' version '1.1.13'
    id "io.github.ben-manes.versions" version "0.64.0"
    id "idea"
}

group = 'bench'
version = '1.0'

// GraalVM's current release line uses JDK 25; the JVM build stays on JDK 26.
def javaVersion = providers.gradleProperty('javaVersion').map { it.toInteger() }.getOrElse(26)
def jextractHome = providers.environmentVariable('JEXTRACT_HOME')
def sqliteSource = layout.projectDirectory.dir('.tools/sqlite-amalgamation-3530400')
def nativeOs = System.getProperty('os.name') == 'Mac OS X' ? 'macos' : 'linux'
def nativeArch = System.getProperty('os.arch') in ['aarch64', 'arm64'] ? 'aarch64' : 'x86_64'
def nativeName = nativeOs == 'macos' ? 'libsqlite3.dylib' : 'libsqlite3.so'
def nativeLibrary = layout.buildDirectory.file("native/${nativeOs}-${nativeArch}/${nativeName}")
def generatedBindings = layout.buildDirectory.dir('generated/sources/jextract')

tasks.register('prepareSqlite', Exec) {
    inputs.files('prepare-sqlite.py', '../db/prepare-sqlite.py', '../db/sqlite-config.json')
    outputs.dir(sqliteSource)
    commandLine 'python3', 'prepare-sqlite.py', '--prepare-only'
    if (gradle.startParameter.offline) args '--offline'
}

tasks.register('buildSqlite', Exec) {
    dependsOn 'prepareSqlite'
    inputs.files(sqliteSource.file('sqlite3.c'), sqliteSource.file('sqlite3.h'), 'prepare-sqlite.py', '../db/prepare-sqlite.py', '../db/sqlite-config.json')
    inputs.property('compiler', providers.environmentVariable('CC').orElse('cc'))
    inputs.property('platform', "${nativeOs}-${nativeArch}")
    outputs.file(nativeLibrary)
    commandLine 'python3', 'prepare-sqlite.py', '--output', nativeLibrary.get().asFile.absolutePath
    if (gradle.startParameter.offline) args '--offline'
}

processResources {
    dependsOn 'buildSqlite'
    from(nativeLibrary) { into "native/${nativeOs}-${nativeArch}" }
}

tasks.register('generateSqliteBindings', Exec) {
    dependsOn 'prepareSqlite'
    def header = sqliteSource.file('sqlite3.h')
    inputs.file(header)
    inputs.file('build.gradle')
    inputs.property('jextractHome', jextractHome.orElse('PATH'))
    outputs.dir(generatedBindings)
    executable = jextractHome.map { "${it}/bin/jextract" }.getOrElse('jextract')
    args header.asFile.absolutePath, '--target-package', 'org.sqlite',
        '--output', generatedBindings.get().asFile.absolutePath
}

sourceSets.main.java.srcDir(generatedBindings)
idea.module.generatedSourceDirs += generatedBindings.get().asFile

tasks.named('compileKotlin') { dependsOn 'generateSqliteBindings' }
tasks.named('compileJava') { dependsOn 'generateSqliteBindings' }

application {
    mainClass = "bench.Main"
    applicationDefaultJvmArgs.addAll(
        "--enable-native-access=ALL-UNNAMED",
    )
}

repositories {
    mavenCentral()
}

// Use fastjson2 for Vert.x's JSON SPI too; do not ship its Jackson fallback.
// Evidence: README.md#json, JMH 1.37 (2026-09-17, 2 forks, identical UTF-8 model):
// parse + serialize takes 84.1 ns with fastjson2 2.0.65 vs 287.7 ns with Jackson
// 2.22.2: ~3.42x codec throughput (+242%), or 71% less time per operation.
// This is a codec microbenchmark, not a measured 3.42x HTTP throughput gain.
// FastJsonFactoryTest verifies SPI selection and that Jackson classes are absent.
configurations.configureEach {
    exclude group: 'com.fasterxml.jackson.core'
    exclude group: 'com.fasterxml.jackson.module'
    exclude group: 'com.fasterxml.jackson.datatype'
}

dependencies {
    implementation(
        "org.jetbrains.kotlin:kotlin-stdlib",
        "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0",
    )

    implementation 'com.alibaba.fastjson2:fastjson2:2.0.65'

    implementation(
        platform("io.vertx:vertx-dependencies:5.1.8"),
        "io.vertx:vertx-config",
        "io.vertx:vertx-lang-kotlin-coroutines",
        "io.vertx:vertx-web",

        // pg
        "io.vertx:vertx-pg-client",
    )
    if (nativeOs == 'macos') {
        implementation(
            "io.netty:netty-resolver-dns-native-macos::osx-${nativeArch == 'aarch64' ? 'aarch_64' : nativeArch}",
            "io.netty:netty-transport-native-kqueue::osx-${nativeArch == 'aarch64' ? 'aarch_64' : nativeArch}",
        )
    } else {
        implementation "io.netty:netty-transport-native-epoll::linux-${nativeArch == 'aarch64' ? 'aarch_64' : nativeArch}"
    }

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation(
        'io.vertx:vertx-web-client',
        'org.junit.jupiter:junit-jupiter',
        'org.jetbrains.kotlin:kotlin-test',
        'org.assertj:assertj-core:3.27.7',
    )
}

test {
    useJUnitPlatform()
    def libraryOverride = providers.systemProperty('sqlite.library').orNull
    if (libraryOverride != null) systemProperty 'sqlite.library', libraryOverride
    jvmArgs application.applicationDefaultJvmArgs
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}

java {
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
}

kotlin {
    jvmToolchain(javaVersion)
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(javaVersion.toString())
        /**
         * https://kotlinlang.org/docs/gradle-compiler-options.html#example-of-additional-arguments-usage-via-freecompilerargs
         * https://kotlinlang.org/docs/compiler-reference.html#java-parameters
         */
        freeCompilerArgs.addAll(
            "-Xno-call-assertions",
            "-Xno-param-assertions",
            "-Xno-receiver-assertions",
            "-java-parameters",
        )
    }
}

shadowJar {
    filesMatching(['META-INF/services/**', 'META-INF/*.kotlin_module']) {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    mergeServiceFiles()
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// Stable native files avoid re-extraction and repeated macOS loader validation.
// The fat JAR still contains them for standalone use and Native Image.
def jitNative = layout.buildDirectory.dir('jit/native')
def jitCache = layout.buildDirectory.file('jit/kotlin-bench.aot')
def jitLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(javaVersion)
}

tasks.register('prepareJitNative', Sync) {
    dependsOn 'shadowJar'
    from({ zipTree(tasks.named('shadowJar').get().archiveFile.get().asFile) }) {
        include 'native/**/*.dylib', 'native/**/*.so'
        include 'META-INF/native/*.jnilib', 'META-INF/native/*.dylib', 'META-INF/native/*.so'
        eachFile { path = name }
        includeEmptyDirs = false
    }
    into jitNative
}

tasks.register('buildJit', Exec) {
    dependsOn 'prepareJitNative'
    inputs.file(tasks.named('shadowJar').flatMap { it.archiveFile })
    // HotSpot validates JAR timestamps as well as contents.
    inputs.property('jarTimestamp', tasks.named('shadowJar').flatMap { it.archiveFile }
        .map { it.asFile.lastModified() })
    inputs.dir(jitNative)
    inputs.files('verify-executable.py', 'measure-http.py', '../db/migrations/001_init.up.sql',
        '../testdata/email-validation.json')
    inputs.file(jitLauncher.map { it.executablePath })
    inputs.file(jitLauncher.map { it.metadata.installationPath.file('release') })
    outputs.file(jitCache)
    doFirst {
        // Training uses a disposable migrated DB and verifies real HTTP writes.
        // HotSpot caches classes/linkage/profiles; application code remains JIT compiled.
        commandLine 'python3', 'verify-executable.py',
            '--java', jitLauncher.get().executablePath.asFile.absolutePath,
            '--jar', tasks.named('shadowJar').get().archiveFile.get().asFile.absolutePath,
            '--jvm-arg=-XX:+PerfDisableSharedMem',
            "--jvm-arg=-Djava.library.path=${jitNative.get().asFile.absolutePath}",
            "--jvm-arg=-Dsqlite.library=${jitNative.get().file(nativeName).asFile.absolutePath}",
            "--jvm-arg=-XX:AOTCacheOutput=${jitCache.get().asFile.absolutePath}"
    }
    doLast {
        if (!jitCache.get().asFile.isFile()) throw new GradleException('HotSpot did not produce the AOT cache')
    }
}

graalvmNative {
    toolchainDetection = false
    metadataRepository {
        enabled = true
        version = '1.0.14'
    }
    binaries {
        main {
            imageName = 'kotlin-bench'
            fallback = false
            buildArgs.addAll('-O3', '-march=native', '--enable-native-access=ALL-UNNAMED')
            // fastjson2 2.0.65's build-time String lambdas cannot be captured by
            // Native Image. Let its supported runtime fallbacks initialize there.
            excludeConfig.put('com.alibaba.fastjson2:fastjson2:2.0.65',
                ['^/META-INF/native-image/.*native-image.properties$'])
            buildArgs.add('--initialize-at-run-time=com.alibaba.fastjson2')
        }
    }
}

tasks.named('nativeCompile') {
    dependsOn 'prepareJitNative'
    doLast {
        def binary = layout.buildDirectory.file('native/nativeCompile/kotlin-bench').get().asFile
        copy {
            from jitNative
            into new File(binary.parentFile, 'native')
        }
        providers.exec { commandLine 'strip', binary.absolutePath }.result.get().assertNormalExitValue()
        if (nativeOs == 'macos') {
            providers.exec {
                commandLine 'codesign', '--force', '--sign', '-', binary.absolutePath
            }.result.get().assertNormalExitValue()
        }
    }
}

dependencyUpdates {
    checkConstraints = true
    gradleReleaseChannel = 'current'

    rejectVersionIf {
        it.candidate.version =~ /(?i)(alpha|beta|eap|rc|cr|snapshot|(?:^|[.-])m\d)/
    }
}
