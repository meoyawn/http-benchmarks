version: 3

includes:
  load: {taskfile: ../loadgen/Taskfile.yaml, dir: ../loadgen}

vars:
  BINARY: dist/server
  LOCAL_PORT: 3000
  UNIX_SOCKET: /tmp/bun.sock

tasks:
  openapi:
    cmd: bun responsible ../openapi/http.kdl -o ../openapi/http.json
    sources:
      - ../openapi/http.kdl
      - bun.lockb
    generates:
      - ../openapi/http.json

  start:
    - bun --watch src/server.ts

  jbuild:
    desc: Single .js
    cmd: bun build --minify --sourcemap src/server.ts --outdir dist/ --packages=external
    sources:
      - src/**/*
      - bun.lockb
      - tsconfig.json
      - Taskfile.yaml
    generates:
      - dist/server.js

  jstart:
    deps:
      - jbuild
    cmd: bun dist/server.js

  build:
    desc: Single executable
    cmds:
      - bun build --compile --minify --sourcemap src/server.ts --outfile {{.BINARY}}
      - defer: find . -maxdepth 1 -type f -name "*.bun-build" -delete
    sources:
      - src/**/*
      - bun.lockb
      - tsconfig.json
      - Taskfile.yaml
    generates:
      - "{{.BINARY}}"

  bstart:
    deps:
      - build
    cmd: ./{{.BINARY}}

  post:
    deps: [load:build]
    cmd: python3 ../loadgen/run.py posts --socket {{.UNIX_SOCKET}} {{.CLI_ARGS}}
