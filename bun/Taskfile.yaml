version: 3

includes:
  load: {taskfile: ../loadgen/Taskfile.yaml, dir: ../loadgen}

tasks:
  setup:
    run: once
    cmd: bun install --frozen-lockfile

  check:
    cmd: bun run check

  start:
    cmd: bun --watch src/server.ts {{.CLI_ARGS}}

  build:
    desc: Standalone native Bun executable
    run: once
    cmd: bun run build
    sources: [src/**/*.ts, package.json, bun.lock, tsconfig.json, Taskfile.yaml]
    generates: [dist/server]

  bstart:
    deps: [build]
    cmd: ./dist/server {{.CLI_ARGS}}

  test:
    deps: [build]
    cmd: python3 test-http.py

  post:
    deps: [load:build]
    cmd: python3 ../loadgen/run.py posts --socket /tmp/benchmark.sock {{.CLI_ARGS}}

  echo:
    deps: [load:build]
    cmd: python3 ../loadgen/run.py echo --socket /tmp/benchmark.sock {{.CLI_ARGS}}
